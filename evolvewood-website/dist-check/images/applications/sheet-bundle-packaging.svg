<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Sheet Bundle Packaging</title>
  <desc id="desc">Industrial sheet bundles stacked on pallets inside a warehouse.</desc>
  <defs>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2f5f40"/>
      <stop offset="100%" stop-color="#1f412d"/>
    </linearGradient>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26312d"/>
      <stop offset="100%" stop-color="#1d2421"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9e9e9"/>
      <stop offset="100%" stop-color="#9da5aa"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7bc86"/>
      <stop offset="100%" stop-color="#a98254"/>
    </linearGradient>
  </defs>
  <rect width="800" height="330" fill="url(#wall)"/>
  <rect y="330" width="800" height="270" fill="url(#floor)"/>
  <g opacity=".22" stroke="#9dc6b1" stroke-width="8">
    <path d="M70 0v330"/>
    <path d="M170 0v330"/>
    <path d="M630 0v330"/>
    <path d="M730 0v330"/>
  </g>
  <g opacity=".25">
    <rect x="70" y="90" width="120" height="40" fill="#82715b"/>
    <rect x="220" y="75" width="130" height="55" fill="#8a785f"/>
    <rect x="600" y="70" width="90" height="60" fill="#8a785f"/>
  </g>
  <g transform="translate(140 215)">
    <polygon points="0 50 360 50 510 120 155 120" fill="#78614b" opacity=".6"/>
    <polygon points="15 0 375 0 515 62 160 62" fill="url(#sheet)"/>
    <polygon points="45 -28 405 -28 545 34 190 34" fill="url(#wood)"/>
    <rect x="52" y="-18" width="8" height="138" fill="#202020" opacity=".8"/>
    <rect x="140" y="-12" width="8" height="132" fill="#202020" opacity=".8"/>
    <rect x="250" y="-6" width="8" height="126" fill="#202020" opacity=".8"/>
    <rect x="360" y="0" width="8" height="120" fill="#202020" opacity=".8"/>
  </g>
  <g transform="translate(95 300)" opacity=".95">
    <polygon points="0 30 355 30 475 90 120 90" fill="#665340"/>
    <polygon points="10 0 365 0 485 60 130 60" fill="url(#sheet)"/>
    <polygon points="35 -22 390 -22 510 38 155 38" fill="url(#wood)"/>
    <rect x="40" y="-14" width="7" height="104" fill="#171717"/>
    <rect x="150" y="-8" width="7" height="98" fill="#171717"/>
    <rect x="262" y="-2" width="7" height="92" fill="#171717"/>
    <rect x="374" y="4" width="7" height="86" fill="#171717"/>
  </g>
</svg>
